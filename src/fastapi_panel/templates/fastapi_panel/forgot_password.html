{% extends "fastapi_panel/base.html" %}
{% block body %}
<main class="login">
  <form class="login-card" method="post">
    <h1>{{ title }}</h1>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if sent %}
    <div class="message message-success" role="status">If that account exists, a reset link is on its way. It works for one hour.</div>
    {% else %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <button class="button button-primary" type="submit">Send reset link</button>
    {% endif %}
    <a class="login-link" href="{{ root }}/login">Back to log in</a>
  </form>
</main>
{% endblock %}
