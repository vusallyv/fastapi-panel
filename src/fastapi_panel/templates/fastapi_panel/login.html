{% extends "fastapi_panel/base.html" %}
{% block body %}
<main class="login">
  <form class="login-card" method="post" action="{{ root }}/login{% if next %}?next={{ next|urlencode }}{% endif %}">
    <h1>{{ site.header }}</h1>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if error %}<div class="message message-error" role="alert">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button button-primary" type="submit">Log in</button>
  </form>
</main>
{% endblock %}
