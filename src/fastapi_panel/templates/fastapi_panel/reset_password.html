{% extends "fastapi_panel/base.html" %}
{% block body %}
<main class="login">
  <form class="login-card" method="post">
    <h1>{{ title }}</h1>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="id_new">New password</label>
    <input id="id_new" name="new" type="password" autocomplete="new-password" autofocus required>
    {% if errors.get("new") %}<p class="field-error" role="alert">{{ errors.new }}</p>{% endif %}
    <label for="id_confirm">New password again</label>
    <input id="id_confirm" name="confirm" type="password" autocomplete="new-password" required>
    {% if errors.get("confirm") %}<p class="field-error" role="alert">{{ errors.confirm }}</p>{% endif %}
    <button class="button button-primary" type="submit">Change password</button>
  </form>
</main>
{% endblock %}
